name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the runtime halves
        run: npm run build

      - name: Committed halves match src/
        run: git diff --exit-code -- desktop/plugin.js tui/hermes-vitals-light.mjs

      - name: Desktop and TUI tests
        run: npm test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the route test dependencies
        run: pip install psutil fastapi httpx

      - name: Backend tests
        run: python -m unittest discover -s test -p "test_*.py" -v
